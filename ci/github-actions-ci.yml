name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      # Type errors should fail the build rather than reach production silently.
      - run: npm run check
      - run: npm run build

# NOTE: not installed at .github/workflows/ci.yml because the deploy token used
# here lacks the `workflow` scope. Move this file to .github/workflows/ci.yml
# from a session with that scope (or commit it through the GitHub web UI) to
# enable it.
